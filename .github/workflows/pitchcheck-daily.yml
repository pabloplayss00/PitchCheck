name: PitchCheck Daily Update

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day — adjust if you want a different time
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab, for testing

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            You maintain data.js for a static football-odds site called
            PitchCheck. It has a MATCHES object keyed by league id
            ("epl", "laliga", "seriea", "bundesliga", "ligue1"). Each
            league is an array of rows: [date, home, away, homeGoals,
            awayGoals, kickoff]. Played matches have numeric homeGoals/
            awayGoals and kickoff is null. Unplayed fixtures have
            homeGoals/awayGoals as null and kickoff is a "HH:MM" string.

            Task, for each of the five leagues:

            1. Find the most recent date with numeric goals already
               recorded for that league in data.js.
            2. Search the web for real match results in that league
               (Premier League, La Liga, Serie A, Bundesliga, Ligue 1
               respectively) for any date after that point, up through
               today.
            3. Cross-check every score against at least two independent
               sources before trusting it. Never guess, extrapolate, or
               invent a score you can't confirm from two sources.
            4. For each newly confirmed result, edit the matching row
               in data.js: fill in the real homeGoals/awayGoals and set
               kickoff to null. Team names must exactly match the
               spelling already used in that league's `teams` array in
               data.js — never introduce a new spelling or add a team
               that isn't already there.
            5. Only fill in scores for fixture rows that already exist
               in MATCHES. Do not add new rows, and do not touch
               ROSTERS, REFEREES_BY_LEAGUE, teams tables, or anything
               else in the file.
            6. If a league has no new confirmed results, leave it
               untouched.
            7. If you made no changes anywhere, end without committing.
            8. If you made changes, commit them to this branch with a
               clear message (e.g. "Update results: 3 matches across 2
               leagues") and push.

            Be conservative — an incorrect score is worse than a
            temporarily missing one. If a result is ambiguous or you
            can't cross-confirm it from two sources, leave that fixture
            as unplayed rather than guessing.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "WebSearch,WebFetch,Bash,Read,Edit,Write"
            --max-turns 40
